<html lang="fr">
<head>

<title>Contrôle — Clément Design</title>

</head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand">Clément Design<small>Logistics &amp; Traceability</small></div><nav class="nav"><a data-nav href="../index.html">🏠 Dashboard</a><a data-nav href="../label-generator.html">🏷️ Étiquettes</a><a data-nav href="fabrication.html">🛠️ Fabrication spéciale</a><a data-nav href="reception.html">📦 Réception / Scan</a><a data-nav href="controle.html">🔎 Contrôle</a><a data-nav href="colisage.html">📋 Colisage</a><a data-nav href="historique.html">🕘 Historique</a></nav></aside>
<main class="main">
<div class="top"><div><h1>Contrôle</h1><div class="user">Vérification des codes et anomalies.</div><div id="config-status" class="user"></div></div></div>
<div class="card">
<div class="field"><label for="control-input">Scanner un code</label><input id="control-input" class="scan-in" autofocus autocomplete="off" placeholder="EAN + Entrée"></div>
<div class="stats">
<div class="s"><div class="n" id="c-total">0</div><div class="l">Contrôlés</div></div>
<div class="s"><div class="n" id="c-ok">0</div><div class="l">Conformes</div></div>
<div class="s bad"><div class="n" id="c-ko">0</div><div class="l">Anomalies</div></div>
</div>
<div class="actions"><label class="check"><input type="checkbox" id="sound" checked> Son</label></div>
<div id="control-msg" class="msg"></div>
</div>
<div class="card section"><div class="table-wrap"><table class="table"><thead><tr><th>Heure</th><th>EAN</th><th>Désignation</th><th>Résultat</th></tr></thead><tbody id="control-list"></tbody></table></div></div>
</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<script src="../js/catalog.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/app.js"></script>
<script src="../js/controle.js"></script>
</body>
</html>
